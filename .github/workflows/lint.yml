# リポジトリ全体の静的検査（環境を問わないもの）。環境ごとの検査は env-<name>.yml に置く。
name: lint

on:
  pull_request:
    paths:
      - "**.sh"
      - ".github/workflows/**"
      - ".github/renovate.json5"
  push:
    branches: [main]
    paths:
      - "**.sh"
      - ".github/workflows/**"
      - ".github/renovate.json5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: 1.32.0

jobs:
  shellcheck:
    # shellcheck はプリインストール済みなので軽量 runner で足りる
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck

  workflows:
    # actionlint（構文・型、run: 内は shellcheck）と zizmor（セキュリティ）
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${tarball}"
          tar -xzf "${tarball}" actionlint
          ./actionlint
      - name: zizmor
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --offline --format=github .github/workflows/

  renovate:
    # Renovate 設定の構文・スキーマ検証（renovate は Node 24 以上が必要）
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npx --yes --package renovate -- renovate-config-validator --strict
