# envs/debian-pc の検査。ISO はパスワードを含むため、成果物としてアップロードしない。
# 環境を追加するときは、このファイルを複製して env-<name>.yml を作り、paths と中身を書き換える。
name: env/debian-pc

on:
  pull_request:
    paths:
      - "envs/debian-pc/**"
      - ".github/workflows/env-debian-pc.yml"
  push:
    branches: [main]
    paths:
      - "envs/debian-pc/**"
      - ".github/workflows/env-debian-pc.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: envs/debian-pc

jobs:
  config:
    # preseed の書式と systemd ユニットの検証。どちらも警告は出すが失敗にしないので、出力があれば失敗とする
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: preseed
        run: |
          out="$(debconf-set-selections --checkonly preseed.cfg 2>&1)"
          if [ -n "${out}" ]; then echo "${out}"; exit 1; fi
      - name: systemd units
        run: |
          # ExecStart のパス（/opt/agent-env）をチェックアウト先に置き換えて検証する。
          # bootstrap.sh が入れるユニットは、ツール本体が必要なので bootstrap ジョブで検証する
          dir="$(mktemp -d)"
          sed "s|/opt/agent-env|${GITHUB_WORKSPACE}|g" system/agent-env-firstboot.service > "${dir}/agent-env-firstboot.service"
          out="$(systemd-analyze verify "${dir}"/* 2>&1)"
          if [ -n "${out}" ]; then echo "${out}"; exit 1; fi
      - name: 監視の概要ページ（dashboard.html）の外部ファイル
        working-directory: envs/debian-pc/gateway/web
        run: |
          # 外部から読み込むファイルはすべて integrity（SRI）付きで、値が正しいこと。
          # Renovate は版だけを更新するので、違えば正しい値を表示する（それで dashboard.html を直す）
          test "$(grep -cE '(src|href)="https?://' dashboard.html)" -eq 2
          grep -oE '(src|href)="https://cdn\.jsdelivr\.net/[^"]+" integrity="sha384-[^"]+"' dashboard.html > /tmp/sri
          test "$(wc -l < /tmp/sri)" -eq 2
          while read -r ref integrity; do
            url="${ref#*=\"}"; url="${url%\"}"
            want="${integrity#integrity=\"}"; want="${want%\"}"
            got="sha384-$(curl -fsSL "${url}" | openssl dgst -sha384 -binary | base64 -w0)"
            if [ "${got}" != "${want}" ]; then echo "${url}: integrity=\"${got}\""; exit 1; fi
          done < /tmp/sri

  gateway:
    # ゲートウェイ（gateway/）の検査とテスト。Go は bootstrap.sh と同じく tools.conf で固定したものを使う
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go
        run: |
          # shellcheck disable=SC1091
          source tools.conf
          curl -fsSL -o "${RUNNER_TEMP}/go.tar.gz" "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          echo "${GO_SHA256}  ${RUNNER_TEMP}/go.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/go.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/go/bin" >> "${GITHUB_PATH}"
      - name: gofmt、vet、test
        working-directory: envs/debian-pc/gateway
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
        run: |
          out="$(gofmt -l .)"
          if [ -n "${out}" ]; then echo "gofmt が必要: ${out}"; exit 1; fi
          go vet ./...
          go test ./...

  bootstrap:
    # Debian 13 コンテナで bootstrap を2回実行し、冪等に成功することを確認する。
    # エージェントのツールが入り、管理者用の設定を agent ユーザーが上書きできないことも確認する。
    # 続けて apply.sh（手動反映）が、非対話・初回セットアップ未完了・同時実行・main 以外・不承認では何も変えず、承認したときだけ反映することを確認する。
    # （docker デーモンが必要なので ubuntu-slim は使えない）
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/src:ro" debian:trixie bash -euo pipefail -c "$(cat <<'EOF'
          /src/envs/debian-pc/bootstrap.sh
          # agent が ~/work を root 所有のディレクトリへのシンボリックリンクにしても、2 回目の bootstrap がそれを変えないこと
          su - agent -c 'rm -r ~/work && ln -s /var/lib ~/work'
          /src/envs/debian-pc/bootstrap.sh | tee /tmp/bootstrap.log
          test "$(stat -c '%U %a' /var/lib)" = "root 755"
          su - agent -c 'rm ~/work && mkdir ~/work'
          id agent
          grep "^agent:" /etc/subuid /etc/subgid
          test -f /etc/apt/apt.conf.d/52agent-env-unattended-upgrades

          # エージェントのツール
          claude --version && mise --version && gh --version && tailscale version
          grep -qx 'Environment=TS_NO_LOGS_NO_SUPPORT=true' /etc/systemd/system/tailscaled.service.d/agent-env.conf
          test -f /etc/claude-code/managed-settings.json
          # agent ユーザーの dotfiles。tmux が設定をエラー無く読め、.tmux.conf の端末の種類（tmux-256color）が使えること
          su - agent -c 'test "$(readlink ~/.tmux.conf)" = dotfiles/.tmux.conf && test "$(readlink ~/.bashrc)" = dotfiles/.bashrc'
          su - agent -c 'tmux -L ci -f /dev/null new-session -d && tmux -L ci source-file ~/.tmux.conf && tmux -L ci kill-server'
          infocmp tmux-256color >/dev/null
          # mise のグローバルの言語ツールと Codex CLI
          su - agent -c 'java -version && go version && node --version && pnpm --version && codex --version'
          # Codex のサンドボックス用の bubblewrap と、ローカル LLM に依頼するコマンド（サーバーが無ければすぐ失敗する）
          command -v bwrap
          su - agent -c 'if local-llm hello < /dev/null 2> /tmp/local-llm.err; then exit 1; fi; grep -q "接続できません" /tmp/local-llm.err'
          # GitHub のトークンの使い分け: git は URL の持ち主、gh は操作対象のリポジトリの持ち主のトークンを使う
          test "$(command -v gh)" = /usr/local/bin/gh
          su - agent -c '
            set -eu
            echo tok-alice | agent-env-github-token set Alice
            echo tok-org | agent-env-github-token set my-org
            test "$(stat -c %a ~/.config/agent-env/github-tokens ~/.config/agent-env/github-tokens/alice | tr "\n" " ")" = "700 600 "
            cred() { printf "protocol=https\nhost=github.com\npath=%s\n\n" "$1" | GIT_TERMINAL_PROMPT=0 git credential fill | sed -n "s/^password=//p"; }
            test "$(cred alice/repo.git)" = tok-alice
            test "$(cred My-Org/repo.git)" = tok-org
            # トークンの無い持ち主では、後続の helper（以前の gh auth setup-git など）を使わない
            git config --global credential.https://github.com.helper "!f() { echo password=stale; }; f"
            if printf "protocol=https\nhost=github.com\npath=unknown/repo.git\n\n" | GIT_TERMINAL_PROMPT=0 git credential fill; then exit 1; fi
            test "$(cred alice/repo.git)" = tok-alice
            git config --global --unset credential.https://github.com.helper
            r="$(mktemp -d)" && cd "${r}" && git init -q
            git remote add origin https://github.com/my-org/repo.git
            test "$(gh auth token)" = tok-org
            git remote set-url origin git@github.com:Alice/repo.git
            test "$(gh auth token)" = tok-alice
            # SSH の URL は HTTPS に読み替える
            test "$(git remote get-url origin)" = https://github.com/Alice/repo.git
            git remote set-url origin ssh://git@github.com/Alice/repo.git
            test "$(git remote get-url origin)" = https://github.com/Alice/repo.git
            test "$(gh auth token)" = tok-alice
            # gh repo set-default の設定を優先する
            git remote add upstream https://github.com/my-org/repo.git
            test "$(gh auth token)" = tok-org
            git config remote.origin.gh-resolved base
            test "$(gh auth token)" = tok-alice
            # 引数で指定したリポジトリは、GH_REPO やリモートより優先する（通信しないよう、実行する gh を差し替えて確認する）
            printf "#!/bin/sh\necho \"\${GH_TOKEN:-none}\"\n" > ~/fake-gh && chmod +x ~/fake-gh
            sed "s|^real=.*|real=${HOME}/fake-gh|" /usr/local/bin/gh > ~/gh-test && chmod +x ~/gh-test
            t() { test "$(~/gh-test "$@" 2>/dev/null)" = "${want}"; }
            want=tok-org && GH_REPO=Alice/repo t repo view my-org/repo
            GH_REPO=Alice/repo t api repos/my-org/repo
            GH_REPO=Alice/repo t api -X GET orgs/my-org/repos
            t repo list --limit 10 my-org
            t repo clone -u up my-org/repo -- --depth 1
            want=tok-alice && GH_REPO=Alice/repo t repo view
            GH_REPO=Alice/repo t api "repos/{owner}/{repo}"
            # upstream、github、origin 以外のリモートも、github.com を指す最初のものを使う
            git config --unset remote.origin.gh-resolved
            git remote remove origin && git remote set-url upstream https://gitlab.com/x/y.git
            git remote add work https://github.com/my-org/repo.git
            want=tok-org && t pr list
            rm ~/fake-gh ~/gh-test
            # 持ち主がわからず、トークンが複数ある場合は、gh に保存済みの認証情報も使わない
            mkdir -p ~/.config/gh && printf "github.com:\n    oauth_token: stale\n    user: x\n" > ~/.config/gh/hosts.yml
            cd / && if gh auth token; then exit 1; fi
            if gh auth login --with-token < /dev/null; then exit 1; fi
          '
          # デフォルトブランチへの force push と削除は、pre-push フックが止める（リモートはローカルの bare リポジトリで代用する）
          su - agent -c '
            set -eu
            cd "$(mktemp -d)"
            git init -q --bare -b main remote.git && git clone -q remote.git w 2> /dev/null && cd w
            git config user.email a@example.com && git config user.name a
            git commit -q --allow-empty -m 1 && git push -q origin main
            git commit -q --allow-empty -m 2 && git push -q origin main
            git switch -q -c feature && git push -q origin feature
            git commit -q --amend --allow-empty -m 2b && git push -q -f origin feature
            git switch -q main && git reset -q --hard HEAD~1
            if git push -q -f origin main; then exit 1; fi
            if git push -q --force-with-lease origin main; then exit 1; fi
            if git push -q origin +HEAD:main; then exit 1; fi
            if git push -q origin :main; then exit 1; fi
            git push -q origin :feature
            # デフォルトブランチが main 以外の場合
            git -C ../remote.git symbolic-ref HEAD refs/heads/feature && git push -q origin HEAD:feature
            git push -q -f origin main
            if git push -q -f origin "$(git commit-tree -m x "$(git write-tree)")":refs/heads/feature; then exit 1; fi
            # リポジトリ自身のフックも実行する
            printf "#!/bin/sh\necho repo-pre-commit > /tmp/hook.log\n" > .git/hooks/pre-commit
            printf "#!/bin/sh\ncat >> /tmp/hook.log\nexit 1\n" > .git/hooks/pre-push
            chmod +x .git/hooks/pre-commit .git/hooks/pre-push
            git commit -q --allow-empty -m 3 && test "$(cat /tmp/hook.log)" = repo-pre-commit
            if git push -q origin main; then exit 1; fi
            grep -q " refs/heads/main " /tmp/hook.log && rm /tmp/hook.log
          '
          # bootstrap はもう一度実行しても成功する
          /src/envs/debian-pc/bootstrap.sh > /tmp/bootstrap-3.log 2>&1 || { cat /tmp/bootstrap-3.log; exit 1; }
          # エージェントへの指示。詳細のファイルを指していること
          cmp /src/envs/debian-pc/system/agents/instructions.md /etc/claude-code/CLAUDE.md
          cmp /src/envs/debian-pc/system/agents/local-llm.md /etc/agent-env/local-llm.md
          grep -q "/etc/agent-env/local-llm.md" /etc/claude-code/CLAUDE.md
          # Codex は管理者用の設定の developer_instructions で読む（TOML として読めること）
          python3 -c 'import sys, tomllib; c = tomllib.load(open("/etc/codex/managed_config.toml", "rb")); sys.exit(c["developer_instructions"] != open("/etc/claude-code/CLAUDE.md").read())'
          # Codex のサンドボックスで書き込みを許可するディレクトリが、agent ユーザーの所有で存在すること
          python3 -c 'import tomllib; print("\n".join(tomllib.load(open("/etc/codex/managed_config.toml", "rb"))["permissions"]["agent-env"]["filesystem"]))' \
            | while read -r d; do test "$(stat -c %U "${d}")" = agent; done
          # Codex が権限プロファイルを読み、外向きの通信と ~/.gradle への書き込みが有効になっていること（ログイン不要の確認用コマンド）
          su - agent -c 'cd ~/work && codex debug prompt-input' > /tmp/codex-prompt.json
          grep -q 'Network access is enabled' /tmp/codex-prompt.json || { cat /tmp/codex-prompt.json; exit 1; }
          grep -q 'access=\\"write\\"><path>/home/agent/.gradle</path>' /tmp/codex-prompt.json
          # 管理者用の設定は agent ユーザーの設定（ユーザー単位・プロジェクト単位）より優先される
          su - agent -c "claude update" 2>&1 | grep -q "disabled by your administrator"

          # NVIDIA ドライバー: GPU が無い CI では入れないが、リポジトリと依存関係が解決できることを確認する
          grep -q "NVIDIA の GPU が無いのでスキップします" /tmp/bootstrap.log
          pkgs="$(sed -n 's/^NVIDIA_PKGS=(\(.*\))$/\1/p' /src/envs/debian-pc/bootstrap.sh)"
          test -n "${pkgs}"
          apt-get install -s -q --no-install-recommends ${pkgs} | grep -q "^Inst nvidia-kernel-open-dkms "
          # MOK: GPU が無ければ何もしない
          /src/envs/debian-pc/mok-enroll.sh | grep -q "NVIDIA GPU が無い"

          # ローカル LLM: llama.cpp は GPU が無くても入る。モデルとサーバーは GPU が無ければ入れない
          /opt/llama.cpp/current/llama-server --version
          # サービスはルーターモード（モデルの切り替え）の引数を使う
          /opt/llama.cpp/current/llama-server --help | grep -q -- "--models-preset PATH"
          /opt/llama.cpp/current/llama-server --help | grep -q -- "--models-max N"
          # llama-models.ini が参照するファイルと、tools.conf でダウンロードするファイルが一致すること
          ini="$(sed -nE 's#^(model|mmproj) = /var/lib/llama/models/##p' /src/envs/debian-pc/system/llama-models.ini | sort)"
          conf="$(bash -c 'source /src/envs/debian-pc/tools.conf; for f in "${LLAMA_FILES[@]}"; do echo "${f%% *}"; done' | sort)"
          test -n "${ini}"
          test "${ini}" = "${conf}"
          grep -q "モデルとサーバーは入れません" /tmp/bootstrap.log
          # GPU が無いので nvidia-smi も無い。GPU の確認（ExecStartPre）だけを差し替えて検証する
          sed 's|^ExecStartPre=/usr/bin/nvidia-smi .*|ExecStartPre=/usr/bin/true|' /src/envs/debian-pc/system/agent-env-llama.service > /tmp/agent-env-llama.service
          grep -q '^ExecStartPre=/usr/bin/true$' /tmp/agent-env-llama.service
          out="$(systemd-analyze verify /tmp/agent-env-llama.service 2>&1)"
          if [ -n "${out}" ]; then echo "${out}"; exit 1; fi
          # GPU がある場合に入れる CUDA ランタイムの依存関係が解決できること
          apt-get install -s -q --no-install-recommends cuda-cudart-13-5 libcublas-13-5 | grep -q "^Inst libcublas-13-5 "
          # root 以外が書き換えられるファイルが無いこと（llama.cpp の配布物は 777 のディレクトリを含む）
          test -z "$(find /opt/llama.cpp /etc/agent-env /etc/claude-code /etc/codex /usr/local/lib/agent-env /var/lib/agent-env -perm -o+w ! -type l)"

          # 監視: tools.conf のバージョンが入り、ユニットが正しく、どれも外部と通信できない設定であること
          bash -c 'source /src/envs/debian-pc/tools.conf
            /usr/local/bin/node_exporter --version 2>&1 | grep -q "version ${NODE_EXPORTER_VERSION#v} "
            /usr/local/bin/victoria-metrics -version | grep -q -- "-tags-${VICTORIA_METRICS_VERSION}-"
            /usr/local/bin/victoria-logs -version | grep -q -- "-tags-${VICTORIA_LOGS_VERSION}-"'
          grep -q "NVIDIA の GPU が無いので、GPU の指標は取りません" /tmp/bootstrap.log
          mon_units=(agent-env-victoriametrics.service agent-env-victorialogs.service agent-env-node-exporter.service)
          for u in "${mon_units[@]}"; do
            test -L "/etc/systemd/system/multi-user.target.wants/${u}"
            grep -qx 'IPAddressDeny=any' "/etc/systemd/system/${u}"
          done
          grep -qx 'PrivateNetwork=yes' /src/envs/debian-pc/system/monitoring/agent-env-gpu-metrics.service
          sed 's|^ExecStart=/usr/local/libexec/agent-env/gpu-metrics.sh |ExecStart=/src/envs/debian-pc/system/monitoring/gpu-metrics.sh |' \
            /src/envs/debian-pc/system/monitoring/agent-env-gpu-metrics.service > /tmp/agent-env-gpu-metrics.service
          cp /src/envs/debian-pc/system/monitoring/agent-env-gpu-metrics.timer /tmp/
          out="$(cd /etc/systemd/system && systemd-analyze verify "${mon_units[@]}" /tmp/agent-env-gpu-metrics.service /tmp/agent-env-gpu-metrics.timer 2>&1)"
          if [ -n "${out}" ]; then echo "${out}"; exit 1; fi
          test "$(stat -c '%a %U' /etc/agent-env/monitoring-admin.key)" = "600 root"
          key="$(cat /etc/agent-env/monitoring-admin.key)"
          test "${#key}" = 64
          # llama-server の指標を取るモデルと、llama-models.ini のモデルが一致すること。llama-server は指標を提供すること
          test "$(sed -n 's/.*labels: {model: \(.*\)}$/\1/p' /etc/agent-env/monitoring/scrape.yml | sort)" = \
            "$(sed -n 's/^\[\(.*\)\]$/\1/p' /src/envs/debian-pc/system/llama-models.ini | sort)"
          grep -q -- ' --metrics$' /src/envs/debian-pc/system/agent-env-llama.service
          # GPU の指標（nvidia-smi は偽物に差し替える）
          fake="$(mktemp -d)"
          printf '#!/bin/sh\necho "0, Fake GPU, 37, 12, 6123, 8151, 45.67, 52, [N/A], 2610"\n' > "${fake}/nvidia-smi"
          chmod +x "${fake}/nvidia-smi"
          PATH="${fake}:${PATH}" /src/envs/debian-pc/system/monitoring/gpu-metrics.sh /var/lib/agent-env/node-exporter/gpu.prom
          grep -qx 'gpu_up 1' /var/lib/agent-env/node-exporter/gpu.prom
          grep -qx 'gpu_memory_used_bytes{gpu="0",name="Fake GPU"} 6420430848' /var/lib/agent-env/node-exporter/gpu.prom
          if grep -q '^gpu_fan_percent' /var/lib/agent-env/node-exporter/gpu.prom; then exit 1; fi
          # systemd の代わりに、ユニットの ExecStart をそのまま nobody で実行する（%S と %d は一時ディレクトリに置き換える）
          mkdir -p /tmp/mon/state /tmp/mon/cred && cp /etc/agent-env/monitoring-admin.key /tmp/mon/cred/admin-key && chown -R nobody /tmp/mon
          run_unit() {
            local cmd
            cmd="$(sed -n '/^ExecStart=/,/[^\\]$/p' "/etc/systemd/system/$1" | sed -e 's/^ExecStart=//' -e 's/\\$//' | tr '\n' ' ')"
            cmd="${cmd//%S/\/tmp\/mon\/state}"
            cmd="${cmd//%d/\/tmp\/mon\/cred}"
            (setpriv --reuid=nobody --regid=nogroup --clear-groups bash -c "exec ${cmd}" > "/tmp/mon/$1.log" 2>&1 &)
          }
          for u in "${mon_units[@]}"; do run_unit "${u}"; done
          for url in http://127.0.0.1:8428/health http://127.0.0.1:9428/health http://127.0.0.1:9100/metrics; do
            for _ in $(seq 30); do curl -sf -o /dev/null "${url}" && break; sleep 1; done
            curl -sf -o /dev/null "${url}" || { tail -n 20 /tmp/mon/*.log; exit 1; }
          done
          # （curl … | grep -q だと、grep が先に終わったときに curl が失敗し、pipefail で失敗になるので、変数に受けてから調べる）
          metrics="$(curl -s http://127.0.0.1:9100/metrics)"
          grep -q '^gpu_up 1$' <<< "${metrics}"
          grep -q '^node_filesystem_avail_bytes{' <<< "${metrics}"
          # VictoriaMetrics が node_exporter から取得できること（最初の取得まで最大 30 秒）
          # vm_query <問い合わせ> <含むべき文字列>
          vm_query() { local r; r="$(curl -s http://127.0.0.1:8428/api/v1/query --data-urlencode "query=$1")"; grep -qF -- "$2" <<< "${r}"; }
          for _ in $(seq 60); do vm_query 'up{job="node"} == 1' '"job":"node"' && break; sleep 1; done
          vm_query 'up{job="node"} == 1' '"job":"node"'
          # ゲートウェイ（ユニットの ExecStart をそのまま nobody で実行する。TAILNET_HOST は agent-env-tailnet-serve が書く値の例）
          cmd="$(sed -n 's/^ExecStart=//p' /etc/systemd/system/agent-env-gateway.service)"
          (setpriv --reuid=nobody --regid=nogroup --clear-groups env TAILNET_HOST=agent-box.example.ts.net bash -c "exec ${cmd}" > /tmp/gateway.log 2>&1 &)
          for _ in $(seq 30); do curl -s -o /dev/null -H 'Host: agent-box.localhost:8700' http://127.0.0.1:8700/ && break; sleep 1; done
          # gw_code <Host> <パス> [curl の引数...]
          gw_code() { local host="$1" path="$2"; shift 2; curl -s -o /dev/null -w '%{http_code}' -H "Host: ${host}" "$@" "http://127.0.0.1:8700${path}"; }
          test "$(gw_code agent-box.localhost:8700 /)" = 200
          test "$(gw_code dash.agent-box.localhost:8700 /)" = 200
          test "$(gw_code evil.example:8700 /)" = 421
          # tailnet（tailscale serve から）では、画面をポートで選ぶ
          test "$(gw_code agent-box.example.ts.net /)" = 200
          test "$(gw_code agent-box.example.ts.net:8444 /)" = 200
          test "$(gw_code agent-box.example.ts.net:9999 /)" = 421
          test "$(gw_code dash.agent-box.localhost:8700 '/api/v1/query?query=up' -H 'Sec-Fetch-Site: cross-site' -H 'Sec-Fetch-Mode: cors')" = 403
          test "$(gw_code dash.agent-box.localhost:8700 '/api/v1/admin/tsdb/delete_series?match[]=x')" = 404
          # 概要ページ（dashboard.html）: どの問い合わせも文法が正しいこと（ゲートウェイ経由で問い合わせる）
          python3 -c 'import json, re, sys; html = open(sys.argv[1]).read(); m = re.search(r"<script type=\"application/json\" id=\"panels\">(.*?)</script>", html, re.S); print("\n".join(s["expr"] for sec in json.loads(m.group(1)) for p in sec["panels"] for s in p["series"]))' \
            /src/envs/debian-pc/gateway/web/dashboard.html > /tmp/dash-exprs
          test "$(wc -l < /tmp/dash-exprs)" -ge 10
          while IFS= read -r q; do
            r="$(curl -s -G -H 'Host: dash.agent-box.localhost:8700' http://127.0.0.1:8700/api/v1/query_range --data-urlencode "query=${q}" -d start=-1h -d step=30s)"
            jq -e '.status == "success"' <<< "${r}" > /dev/null || { echo "${q}: ${r}"; exit 1; }
          done < /tmp/dash-exprs
          # 削除などの管理用 API は鍵が必要
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST 'http://127.0.0.1:8428/api/v1/admin/tsdb/delete_series?match[]=x')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:8428/api/v1/admin/tsdb/delete_series?match[]=x&authKey=${key}")" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8428/debug/pprof/')" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:9428/delete/run_task?filter=x')" = 401
          # 偽の llama-server を立てる。local-llm（Chat Completions）は応答だけを表示し、標準入力を付けて送ること。
          # local-llm -a（Codex、Responses API）は応答だけを表示し、利用状況が届き、プロンプトは伏せられること
          cat > /tmp/fake-llm.py <<'PY'
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_GET(self):
                  b = json.dumps({"object": "list", "data": [{"id": "qwen3.6-35b-a3b", "object": "model"}]}).encode()
                  self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                  if self.path == "/v1/chat/completions":
                      text = json.loads(body)["messages"][0]["content"][0]["text"]
                      b = json.dumps({"choices": [{"message": {"role": "assistant", "content": "FAKE-ANSWER " + text.replace("\n", " ")}}]}).encode()
                      self.send_response(200); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
                      return
                  self.send_response(200); self.send_header("Content-Type", "text/event-stream"); self.end_headers()
                  for t, d in [("response.created", {"response": {"id": "r"}}),
                               ("response.output_item.done", {"item": {"type": "message", "role": "assistant", "id": "m", "content": [{"type": "output_text", "text": "FAKE-ANSWER"}]}}),
                               ("response.completed", {"response": {"id": "r", "usage": {"input_tokens": 1, "output_tokens": 1, "total_tokens": 2}}})]:
                      d["type"] = t; self.wfile.write(f"event: {t}\ndata: {json.dumps(d)}\n\n".encode())
          http.server.ThreadingHTTPServer(("127.0.0.1", 8080), H).serve_forever()
          PY
          (python3 /tmp/fake-llm.py & echo $! > /tmp/fake-llm.pid)
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8080/models && break; sleep 1; done
          test "$(su - agent -c 'local-llm hello < /dev/null')" = "FAKE-ANSWER hello"
          test "$(su - agent -c 'echo input | local-llm hello')" = "FAKE-ANSWER hello  <stdin> input </stdin>"
          test "$(su - agent -c 'local-llm -a secret-prompt < /dev/null')" = FAKE-ANSWER
          # vl_query <問い合わせ> <含むべき文字列>
          vl_query() { local r; r="$(curl -s http://127.0.0.1:9428/select/logsql/query --data-urlencode "query=$1")"; grep -qF -- "$2" <<< "${r}"; }
          for _ in $(seq 30); do vl_query '_msg:codex.user_prompt' '"prompt"' && break; sleep 1; done
          vl_query '_msg:codex.user_prompt' '"prompt":"[REDACTED]"'
          if vl_query '*' secret-prompt; then exit 1; fi
          for _ in $(seq 30); do vm_query 'codex_api_request_total' '"model":"qwen3.6-35b-a3b"' && break; sleep 1; done
          vm_query 'codex_api_request_total' '"model":"qwen3.6-35b-a3b"'
          # Claude Code: ログインしていないので API は呼べないが、起動時のイベントが届くこと
          su - agent -c 'cd ~/work && timeout 60 claude -p hello < /dev/null' > /tmp/claude.out 2>&1 || true
          for _ in $(seq 30); do vl_query 'service.name:claude-code' '"service.name":"claude-code"' && break; sleep 1; done
          vl_query 'service.name:claude-code' '"service.name":"claude-code"' || { cat /tmp/claude.out; exit 1; }
          # 監視が止まっていても、エージェントはすぐに終わる（pkill -f はこのスクリプト自体に一致するので、プロセス名で止める）
          pkill -x victoria-metric
          pkill -x victoria-logs
          test "$(su - agent -c 'timeout 30 local-llm -a hello < /dev/null')" = FAKE-ANSWER
          pkill -x node_exporter
          kill "$(cat /tmp/fake-llm.pid)"

          # Mac のブラウザから接続するためのサービス（systemd は動いていないので、ユニットの検証と、ブラウザの端末の単体起動）
          out="$(cd /etc/systemd/system && systemd-analyze verify agent-env-terminal.service agent-env-gateway.service 2>&1)"
          if [ -n "${out}" ]; then echo "${out}"; exit 1; fi
          test -L /etc/systemd/system/multi-user.target.wants/agent-env-terminal.service
          test -L /etc/systemd/system/multi-user.target.wants/agent-env-gateway.service
          test -x /usr/local/sbin/agent-env-tailnet-serve
          test "$(stat -c '%a %U' /etc/agent-env/terminal.env)" = "600 root"
          set -a && . /etc/agent-env/terminal.env && set +a
          # ユニットの ExecStart をそのまま agent ユーザーで実行する
          cmd="$(sed -n 's/^ExecStart=//p' /etc/systemd/system/agent-env-terminal.service)"
          (cd /home/agent/work && runuser -u agent -- env TERMINAL_PASSWORD="${TERMINAL_PASSWORD}" bash -c "timeout 60 ${cmd}" &)
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:7681/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7681/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u "agent:${TERMINAL_PASSWORD}" http://127.0.0.1:7681/)" = 200
          # ゲートウェイ経由でも同じ（Basic 認証はそのまま届く）
          test "$(gw_code term.agent-box.localhost:8700 /)" = 401
          test "$(gw_code term.agent-box.localhost:8700 / -u "agent:${TERMINAL_PASSWORD}")" = 200
          test "$(gw_code agent-box.example.ts.net:8443 / -u "agent:${TERMINAL_PASSWORD}")" = 200
          # ビルドに使った Go を記録している（Go かソースが変わったときだけビルドし直すため）
          grep -q "^$(sed -n 's/^GO_SHA256=//p' /src/envs/debian-pc/tools.conf) " /usr/local/lib/agent-env/agent-env-gateway.stamp

          # apply.sh: GitHub の代わりにローカルの bare リポジトリを origin にする
          git config --global user.name ci && git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          cp -r /src /work && rm -rf /work/.git && git -C /work init -q && git -C /work add -A && git -C /work commit -qm base
          git init -q --bare /remote.git && git -C /work push -q /remote.git main
          git clone -q /remote.git /opt/agent-env
          git -C /work commit -q --allow-empty -m next && git -C /work push -q /remote.git main
          apply=/opt/agent-env/envs/debian-pc/apply.sh
          base="$(git -C /opt/agent-env rev-parse HEAD)"
          next="$(git -C /work rev-parse HEAD)"
          export GIT_PAGER=cat
          # 非対話: 失敗し、何も変えない
          if "${apply}" < /dev/null; then exit 1; fi
          test "$(git -C /opt/agent-env rev-parse HEAD)" = "${base}"
          # 初回セットアップが完了していない: 失敗し、何も変えない
          if printf 'yes\n' | script -qec "${apply}" /dev/null; then exit 1; fi
          test "$(git -C /opt/agent-env rev-parse HEAD)" = "${base}"
          mkdir -p /var/lib/agent-env && touch /var/lib/agent-env/firstboot.done
          # 別の apply.sh が実行中（ロック取得中）: 失敗し、何も変えない
          if printf 'yes\n' | flock /run/agent-env-apply.lock script -qec "${apply}" /dev/null; then exit 1; fi
          test "$(git -C /opt/agent-env rev-parse HEAD)" = "${base}"
          # main 以外のブランチ: 失敗し、何も変えない
          git -C /opt/agent-env switch -q -c other
          if printf 'yes\n' | script -qec "${apply}" /dev/null; then exit 1; fi
          test "$(git -C /opt/agent-env rev-parse HEAD)" = "${base}"
          git -C /opt/agent-env switch -q main
          # 承認しない: 失敗し、何も変えない
          if printf 'no\n' | script -qec "${apply}" /dev/null > out.txt; then exit 1; fi
          grep -q "${next}" out.txt
          test "$(git -C /opt/agent-env rev-parse HEAD)" = "${base}"
          test ! -e /var/log/agent-env/apply.log
          # 承認する: 反映して bootstrap を実行し、ログに残す
          printf 'yes\n' | script -qec "${apply}" /dev/null
          test "$(git -C /opt/agent-env rev-parse HEAD)" = "${next}"
          grep -q "START ${base} -> ${next}" /var/log/agent-env/apply.log
          grep -q "OK ${next}" /var/log/agent-env/apply.log
          # bootstrap が失敗するコミット: 失敗として終了し、失敗したコミットをログに残す
          echo no-such-package-agent-env >> /work/envs/debian-pc/packages.txt
          git -C /work commit -qam broken && git -C /work push -q /remote.git main
          broken="$(git -C /work rev-parse HEAD)"
          if printf 'yes\n' | script -qec "${apply}" /dev/null; then exit 1; fi
          grep -q "NG ${broken}" /var/log/agent-env/apply.log
          EOF
          )"

  build-iso:
    # Linux と macOS（bash 3.2・BSD 系コマンド）の両方で build-iso.sh が動くことを確認する。
    # apt/brew install と約 800 MB の ISO 処理があるので ubuntu-slim（1 CPU・15 分制限）は使わない。
    # macOS runner は入れ子の仮想化ができず container / docker が動かないので、build-iso.sh を直接実行する。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # ISO に同梱する git bundle に履歴が必要
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/agent-env
          key: debian-iso-${{ hashFiles('envs/debian-pc/iso.conf') }}
      - name: install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends xorriso cpio
      - name: install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          # 標準の LibreSSL は openssl passwd -6 に対応していない
          brew install xorriso openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "${GITHUB_PATH}"
      - name: build
        run: |
          # ログ（パスワードを含む）と鍵はリポジトリ外に置く。リポジトリ内だと未コミットの変更とみなされる
          ssh-keygen -q -t ed25519 -N '' -f "${RUNNER_TEMP}/ci-key"
          ./build-iso.sh --ssh-key "${RUNNER_TEMP}/ci-key.pub" --allow-non-main > "${RUNNER_TEMP}/build.log"
      - name: check ISO contents
        run: |
          # 実機インストール前の回帰防止: 起動メニュー・preseed・同梱ファイルが期待どおり組み込まれているか
          iso=../../out/agent-env-debian-pc.iso
          dir="$(mktemp -d)"
          xorriso -osirrox on -indev "${iso}" \
            -extract /boot/grub/grub.cfg "${dir}/grub.cfg" \
            -extract /isolinux/isolinux.cfg "${dir}/isolinux.cfg" \
            -extract /install.amd/initrd.gz "${dir}/initrd.gz" \
            -ls /agent-env 2>/dev/null > "${dir}/files.txt"
          for f in repo.bundle authorized_keys late-command.sh select-disk.sh mok-password; do grep -q "'${f}'" "${dir}/files.txt"; done
          grep -q '^menuentry "agent-env: Automated install' "${dir}/grub.cfg"
          grep -q '^set timeout=-1$' "${dir}/grub.cfg"
          grep -qx 'default agentenv' "${dir}/isolinux.cfg"
          grep -qx 'timeout 0' "${dir}/isolinux.cfg"
          gzip -dc "${dir}/initrd.gz" > "${dir}/initrd" 2>/dev/null || true
          grep -aq 'partman/early_command string sh /cdrom/agent-env/select-disk.sh' "${dir}/initrd"
          grep -aqE 'user-password-crypted password [$]6[$][./A-Za-z0-9]+[$][./A-Za-z0-9]{86}$' "${dir}/initrd"
      - name: remove ISO (contains a password)
        if: always()
        working-directory: .
        run: rm -rf out "${RUNNER_TEMP}/build.log" "${RUNNER_TEMP}"/ci-key*
