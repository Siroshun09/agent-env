# Debian 13 の無人インストール用の応答。テンプレートなので直接は使わない。
# build-iso.sh が @...@ を埋めて ISO に組み込む。ディスクは丸ごと消去される。

# インストーラ自体は英語（テキスト版は日本語を表示できない）。システムには ja_JP.UTF-8 も入れる。
d-i debian-installer/language string en
d-i debian-installer/country string JP
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect ja_JP.UTF-8
d-i keyboard-configuration/xkb-keymap select jp
d-i time/zone string Asia/Tokyo
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string agent-box
d-i netcfg/hostname string agent-box
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/non-free-firmware boolean true

# root は無効化し、人間用の admin（sudo あり）を作る。パスワードハッシュはビルド時に入る。
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string admin
d-i passwd/username string admin
d-i passwd/user-password-crypted password @ADMIN_PASSWORD_HASH@

# ディスク全体を使い /home を分ける。build-iso.sh --disk 指定時は partman-auto/disk が末尾に追記される。
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select home
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-efi/non_efi_system boolean true

tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string git ca-certificates sudo
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note

# ISO に同梱したリポジトリ（ビルド時のコミット）を配置し、初回起動時に bootstrap を実行する。
# （インストーラ内ではなく初回起動で実行するのは、ネットワークと systemd が使え、失敗時に再試行できるため）
# SSH 公開鍵が同梱されていれば admin に登録し、SSH のパスワードログインを無効化する。
d-i preseed/late_command string \
  cp /cdrom/agent-env/repo.bundle /target/tmp/agent-env.bundle; \
  in-target git clone -q -b @REPO_BRANCH@ /tmp/agent-env.bundle /opt/agent-env; \
  in-target git -C /opt/agent-env remote set-url origin @REPO_URL@; \
  rm -f /target/tmp/agent-env.bundle; \
  cp /target/opt/agent-env/envs/debian-pc/agent-env-firstboot.service /target/etc/systemd/system/; \
  in-target systemctl enable agent-env-firstboot.service; \
  if [ -f /cdrom/agent-env/authorized_keys ]; then \
    mkdir -p /target/home/admin/.ssh; \
    cp /cdrom/agent-env/authorized_keys /target/home/admin/.ssh/authorized_keys; \
    chmod 700 /target/home/admin/.ssh; chmod 600 /target/home/admin/.ssh/authorized_keys; \
    in-target chown -R admin:admin /home/admin/.ssh; \
    echo "PasswordAuthentication no" > /target/etc/ssh/sshd_config.d/agent-env.conf; \
  fi
