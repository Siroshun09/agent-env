# apt で入らないツールのバージョンと、配布物の SHA-512（npm の integrity 形式）。bootstrap.sh が読む。
# Renovate が npm レジストリからバージョンと integrity を一緒に更新する。
# renovate: datasource=custom.npm-integrity depName=@opencode/cli-linux-x64
OPENCODE_VERSION=2.3.2
OPENCODE_INTEGRITY=sha512-E9txUc4fNtvuEQUiEx84h4/bd/LJZcAHdIu0yfZRP8KDVP79WhzhEd7BTckJUyvWUc58ZP/o+nfgcnTQnvfJgw==

# llama.cpp（ローカル LLM のサーバー）。CUDA 13.5 版のビルド済みバイナリ（Ubuntu 24.04 向けだが Debian 13 で動く）。
# リリースにチェックサムのファイルは無いので、Renovate は GitHub API がリリースの添付ファイルごとに返す
# SHA256（digest）を、バージョンと一緒に更新する（custom.llama-cpp-cuda）
# renovate: datasource=custom.llama-cpp-cuda depName=llama.cpp
LLAMA_CPP_VERSION=b12629
LLAMA_CPP_SHA256=d04ced4f2060019a9246cac49cf98f70b85910fa603b6ec014953fcba5d7c7d0

# llama-server で動かすモデル（GGUF）。Hugging Face のリビジョンとファイルの SHA256 で固定する（Renovate の対象外）。
# VRAM 8GB・メモリ 64GB 向けに、MoE のエキスパートを CPU 側に置いて動かす前提で選んでいる（どちらも Apache-2.0）。
# 形式は「名前 URL SHA256」。名前は OpenCode などから指定するモデル名で、opencode.jsonc と合わせる。
# 同時に読み込むのは 1 つだけで、別のモデルが呼ばれると llama-server が自動で切り替える
LLAMA_MODELS=(
  # Qwen3.6 35B-A3B（UD-Q4_K_XL、約 22.4GB）
  "qwen3.6-35b-a3b https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf 707a55a8a4397ecde44de0c499d3e68c1ad1d240d1da65826b4949d1043f4450"
  # Qwen3-Coder-Next 80B-A3B（UD-Q4_K_XL、約 49.6GB）
  "qwen3-coder-next https://huggingface.co/unsloth/Qwen3-Coder-Next-GGUF/resolve/ce09c67b53bc8739eef83fe67b2f5d293c270632/Qwen3-Coder-Next-UD-Q4_K_XL.gguf 4bb93f0a0221ef4ff963ca9094df629c8dfdfabc3b4fdd85c1a2e4c0624fce36"
)
