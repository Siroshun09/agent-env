# apt で入らないツールのバージョンと、配布物の SHA-512（npm の integrity 形式）。bootstrap.sh が読む。
# Renovate が npm レジストリからバージョンと integrity を一緒に更新する。
# renovate: datasource=custom.npm-integrity depName=@opencode/cli-linux-x64
OPENCODE_VERSION=2.3.2
OPENCODE_INTEGRITY=sha512-E9txUc4fNtvuEQUiEx84h4/bd/LJZcAHdIu0yfZRP8KDVP79WhzhEd7BTckJUyvWUc58ZP/o+nfgcnTQnvfJgw==

# ttyd（ブラウザで使う agent ユーザーの端末。Debian 13 にパッケージが無いので、公式リリースの静的リンク版を使う）。
# Renovate は GitHub API がリリースの添付ファイルごとに返す SHA256（digest）を、バージョンと一緒に更新する（custom.ttyd）
# renovate: datasource=custom.ttyd depName=ttyd
TTYD_VERSION=1.7.7
TTYD_SHA256=8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55

# llama.cpp（ローカル LLM のサーバー）。CUDA 13.5 版のビルド済みバイナリ（Ubuntu 24.04 向けだが Debian 13 で動く）。
# リリースにチェックサムのファイルは無いので、Renovate は GitHub API がリリースの添付ファイルごとに返す
# SHA256（digest）を、バージョンと一緒に更新する（custom.llama-cpp-cuda）
# renovate: datasource=custom.llama-cpp-cuda depName=llama.cpp
LLAMA_CPP_VERSION=b12629
LLAMA_CPP_SHA256=d04ced4f2060019a9246cac49cf98f70b85910fa603b6ec014953fcba5d7c7d0

# llama-server で動かすモデルのファイル（GGUF）。Hugging Face のリビジョンとファイルの SHA256 で固定する（Renovate の対象外）。
# 形式は「保存するファイル名 URL SHA256」。/var/lib/llama/models に保存し、system/llama-models.ini から参照する
LLAMA_FILES=(
  # Qwen3.6 35B-A3B（UD-Q4_K_XL、約 22.4GB、Apache-2.0）。VRAM 8GB・メモリ 64GB 向けに、MoE のエキスパートを
  # CPU 側に置いて動かす前提で選んでいる
  "Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/a483e9e6cbd595906af30beda3187c2663a1118c/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf 707a55a8a4397ecde44de0c499d3e68c1ad1d240d1da65826b4949d1043f4450"
  # 同じモデルの画像入力用（mmproj、約 0.9GB）
  "Qwen3.6-35B-A3B-mmproj-F16.gguf https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF/resolve/a483e9e6cbd595906af30beda3187c2663a1118c/mmproj-F16.gguf 8971ee4f331ff0a4c609374f32984b3d4e6dc086c0aa35f1d637fad1829e887f"
  # 埋め込み用の Qwen3-Embedding-0.6B（Q8_0、約 0.6GB、Apache-2.0。Qwen 公式）
  "Qwen3-Embedding-0.6B-Q8_0.gguf https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/370f27d7550e0def9b39c1f16d3fbaa13aa67728/Qwen3-Embedding-0.6B-Q8_0.gguf 06507c7b42688469c4e7298b0a1e16deff06caf291cf0a5b278c308249c3e439"
)
