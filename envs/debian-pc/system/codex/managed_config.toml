# bootstrap.sh が /etc/codex/managed_config.toml に配置する。手で編集せずリポジトリ側を直すこと。
# 管理者用の設定で、ユーザーの config.toml より優先される（起動のたびに適用される）。
# bootstrap.sh が先頭に developer_instructions（system/agents/instructions.md の内容）を足す

# バージョンは /etc/mise/config.toml で固定し、Renovate と apply.sh で更新する
check_for_update_on_startup = false

# OpenAI への利用状況の送信（analytics）と、フィードバックのアップロードを止める
analytics.enabled = false
feedback.enabled = false

# サンドボックスの権限（作業中のリポジトリ以外は書き込み不可）。ビルドツールが使うキャッシュへの書き込みと、
# 依存のダウンロードなどのための外向きの通信を許可する（無効だと Gradle などがソケットを作れず止まる）。
# 旧来の sandbox_workspace_write は、組み込みのプロファイル（:workspace）が明示的に選ばれると無視されるので、
# 権限プロファイルを定義して既定にする。書き込みを許可するディレクトリは bootstrap.sh が agent ユーザーのホームに作る
default_permissions = "agent-env"

[permissions.agent-env]
description = "Workspace write plus build-tool caches and outbound network"
extends = ":workspace"

[permissions.agent-env.filesystem]
"/home/agent/.gradle" = "write"
"/home/agent/.m2" = "write"
"/home/agent/go" = "write"
"/home/agent/.cache" = "write"
"/home/agent/.npm" = "write"
"/home/agent/.local/share/pnpm" = "write"

[permissions.agent-env.network]
enabled = true

# ローカル LLM（llama.cpp の llama-server）。使うときは codex -c model_provider=llama-cpp -m qwen3.6-35b-a3b
# （一度だけ依頼して応答だけを見るときは、Codex を通さない local-llm コマンド。system/agents/local-llm.sh）。
# モデル名は system/llama-models.ini のセクション名と合わせる
[model_providers.llama-cpp]
name = "llama.cpp（ローカル）"
base_url = "http://127.0.0.1:8080/v1"
wire_api = "responses"

# 利用状況を、この PC の監視（VictoriaLogs と VictoriaMetrics。system/monitoring/）に送る。
# プロンプトと応答の本文は送らない（既定のまま）。応答の途中経過（.delta）のイベントは量が多いので送らない
# （件数と所要時間は指標に残る）。ログの本文（_msg）にはイベント名を使う。
# ツールの実行結果（codex.tool_result）には、既定で引数（コマンドなど）と出力の先頭が入るので、出力は 0 バイトにし、
# 引数と出力の項目は VictoriaLogs が受け取るときに捨てる（ignore_fields）。
# 指標の送り方（累積）は環境変数でしか指定できない（/etc/profile.d/agent-env-monitoring.sh）
[otel]
log_sse_deltas = false
tool_result = { max_bytes = 0 }
exporter = { otlp-http = { endpoint = "http://127.0.0.1:9428/insert/opentelemetry/v1/logs?_msg_field=event.name&ignore_fields=arguments,output", protocol = "binary" } }
metrics_exporter = { otlp-http = { endpoint = "http://127.0.0.1:8428/opentelemetry/v1/metrics", protocol = "binary" } }
