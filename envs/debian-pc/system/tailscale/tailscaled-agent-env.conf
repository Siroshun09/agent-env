# tailscaled.service の追加設定。bootstrap.sh が /etc/systemd/system/tailscaled.service.d/agent-env.conf に配置する。
# Tailscale への診断ログの送信を止める（--no-logs-no-support と同じ。Tailscale のサポートは受けられなくなる）。
# /etc/default/tailscaled はパッケージの設定ファイルなので書き換えない（書き換えると自動更新が止まることがある）
[Service]
Environment=TS_NO_LOGS_NO_SUPPORT=true
