# bootstrap.sh が /etc/mise/config.toml（mise のシステム全体の設定）に配置する。
# どのディレクトリでも使える言語ツールと Codex CLI。プロジェクトの mise.toml があればそちらが優先される。
# バージョンは Renovate が更新する（Java は mise の既定どおり Temurin）
[tools]
java = "27.0.1.1+4"
go = "1.27.4"
node = "26.13.1"
pnpm = "12.21.0"
# Codex CLI（npm で入れるので node が要る。設定は /etc/codex/managed_config.toml）
"npm:@openai/codex" = "0.172.0"
