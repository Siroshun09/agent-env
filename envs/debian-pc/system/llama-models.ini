; llama-server（ルーターモード）が扱うモデルの一覧。bootstrap.sh が /etc/agent-env/ に配置する。
; セクション名がモデル名（API の "model" や Codex の -m で指定する名前）。キーは llama-server の引数名（先頭の -- を除く）。
; ファイルは tools.conf の LLAMA_FILES でダウンロードする
version = 1

; 文章の生成と画像の読み取り。VRAM（8GB）に収まらないエキスパートは --fit（既定で有効）が自動でメインメモリ側に置く
[qwen3.6-35b-a3b]
model = /var/lib/llama/models/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj = /var/lib/llama/models/Qwen3.6-35B-A3B-mmproj-F16.gguf
ctx-size = 65536

; 埋め込み（/v1/embeddings）。小さいので CPU だけで動かし、VRAM は上のモデルに残す
[qwen3-embedding-0.6b]
model = /var/lib/llama/models/Qwen3-Embedding-0.6B-Q8_0.gguf
embeddings = true
pooling = last
device = none
ctx-size = 8192
